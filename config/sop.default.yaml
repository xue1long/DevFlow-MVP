# DevFlow · 默认 SOP 配置模板
# devflow init 时复制到项目根目录
#
# 文档权威级：MVP-门禁降级矩阵.md > DevFlow-MVP-实现简报.md > 本文件 > 架构文档

sop:
  sop_version: "0.1"
  phases: [intake, brainstorm, plan, contract, implement, verify, review, finish]
  intake_fast_skip: true
  red_lines:
    - skip_phase
    - no_test
    - cross_module_import
    - huge_pr
    - uncommitted_bulk
    - main_incomplete
    - doc_drift
    - silent_legacy
    - no_contract
    - circular_dep:
        mvp_skip: true
    - human_step_auto
  pr_max_files: 30
  minimalism_strictness: full
  gates:
    tests_pass:
      command: "pytest --import-mode=importlib -q"
      blocking: true
      enabled: true
      bind_to_stage: 5
    ci_green:
      command: "echo ci-check-placeholder && exit 0"
      blocking: false
      enabled: false
      bind_to_stage: 6
      note: "v0.3.1-r2: 默认禁用(占位命令不应启用)。启用真实 CI: 改为 enabled: true 并配置真实 command"
    intake_gate:
      kind: triage
      require: "ready-for-agent"
      blocking: true
      enabled: true
      bind_to_stage: 0
    review_gate:
      kind: "review"
      blocking: true
      enabled: true
      bind_to_stage: 2
      max_rounds: 5
      require_clear: true
      note: "计划/契约阶段出口需先通过 devflow review 双轴评审"
  modules:
    facade: "__init__.py"
    forbidden_import: ["service/", "model/", "utils/internal/"]
  tooling:
    test_runner: "pytest"
    import_mode: "importlib"
    proxy_strip: true
    # v0.3.2 P1-11: 语言中性化配置(缺省回退 .py)
    languages:
      code_extensions: [".py", ".ts", ".go"]
      test_patterns: ["test", "_test", ".spec."]
      test_extensions: [".test.py", "_test.py", ".test.ts", "_test.ts", ".test.go", "_test.go"]
  storage:
    backend: fs
    specs_dir: docs/devflow/specs
    plans_dir: docs/devflow/plans
    ledger: docs/devflow/progress.yaml
    glossary: docs/devflow/CONTEXT.md
    content_address: false
  allow_fast_forward: false
  # v0.3.3: 思维模型落地配置(宽松默认: MINOR 提示不阻断)
  thinking:
    enabled: true
    severity: "minor"
  # v0.4: 引文式调研配置(RFC §6.1)
  # 默认启用 plan_stage 自动跑;data_sources 按优先级排序
  # (agent_reach → github → registry → web);
  # fallback=skip 保证离线环境不阻断流程。
  research:
    enabled: true
    auto_run_on: [plan_stage]
    sources: [github, pypi, npm, web]
    max_results_per_source: 5
    max_total_chars: 8000
    timeout_per_source: 10
    fallback: skip
    citation_required: true
    start_keywords:
      - "from scratch"
      - "重新实现"
      - "重写"
      - "造轮子"
      - "自己写一个"
    # v0.4.2: 24h 同 query 复用(dogfooding 发现 SOP 三份不一致,统一补全)
    cache:
      enabled: true
      ttl_seconds: 86400
      shared_across_specs: true
    # v0.4.3: research 自动喂 plan(结构化提取,不调 LLM)
    auto_fill_goals:
      enabled: true
      max_goals: 5
      overwrite_existing: false  # 默认仅覆盖占位,不破坏用户内容
